# Site settings
title: Serhii Turivnyi
email: turivniy@gmail.com
description: >-
  Thoughts on management, teams, technology, and meaningful work.
baseurl: ""
url: "https://sturivny.github.io"
lang: en

author:
  name: Serhii Turivnyi
  email: turivniy@gmail.com

tagline: Thoughts on management, teams, technology, and meaningful work.
intro: >-
  I write about management, engineering teams, personal growth, and the ideas
  that help us make work more meaningful.

social:
  github: sturivny
  telegram: https://t.me/sturivny
  rss: true

featured_count: 3

# Default social preview image (existing asset)
default_image: /assets/magic-of-one-on-one-meetings.png

# Build settings
theme: minima
plugins:
  - jekyll-feed

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

sass:
  style: compressed

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
  - "*.srt"
