<header class="site-header" role="banner">
  <div class="site-header__inner">
    <a class="site-identity" href="{{ '/' | relative_url }}" aria-label="{{ site.title | escape }} — home">
      <span class="site-identity__name">{{ site.author.name }}</span>
    </a>

    <nav class="site-nav" aria-label="Primary">
      <ul class="site-nav__list">
        <li><a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Blog</a></li>
        <li><a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} aria-current="page"{% endif %}>About</a></li>
        <li>
          <a href="{{ '/feed.xml' | relative_url }}" aria-label="RSS feed">
            <svg class="icon" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
              <path fill="currentColor" d="M2 2a1 1 0 0 0-1 1v1a1 1 0 0 0 2 0V4h1a1 1 0 0 0 0-2H2zm0 4a1 1 0 0 0-1 1v1a1 1 0 0 0 2 0V7h2a5 5 0 0 1 5 5v1a1 1 0 0 0 2 0V9a7 7 0 0 0-7-7H2zm0 4a1 1 0 0 0-1 1v1a1 1 0 0 0 2 0v-1a1 1 0 0 0-1-1zm0 3a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3z"/>
            </svg>
            <span class="site-nav__label">RSS</span>
          </a>
        </li>
        <li>
          <a href="https://github.com/{{ site.social.github }}" rel="noopener noreferrer" aria-label="GitHub profile">
            <svg class="icon" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
              <path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
            </svg>
            <span class="site-nav__label">GitHub</span>
          </a>
        </li>
        {%- if site.social.telegram -%}
        <li class="site-nav__telegram">
          <a href="{{ site.social.telegram }}" rel="noopener noreferrer" aria-label="Telegram">
            <svg class="icon" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
              <path fill="currentColor" d="M8 0a8 8 0 1 0 0 16A8 8 0 0 0 8 0zm3.93 5.45-1.2 5.66c-.09.41-.33.51-.67.32l-1.85-1.36-1.12 1.08c-.12.12-.22.22-.45.22l.17-2.4 3.44-3.11c.15-.13-.03-.2-.23-.08L5.04 9.5l-2.4-.75c-.52-.16-.53-.52.11-.77l9.38-3.62c.43-.16.81.1.67.77z"/>
            </svg>
            <span class="site-nav__label">Telegram</span>
          </a>
        </li>
        {%- endif -%}
        <li>
          <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Switch to dark theme" aria-pressed="false">
            <svg class="icon theme-toggle__icon theme-toggle__icon--sun" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
              <path fill="currentColor" d="M8 11a3 3 0 1 1 0-6 3 3 0 0 1 0 6zm0 1a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM8 0a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-1 0v-2A.5.5 0 0 1 8 0zm0 13a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-1 0v-2A.5.5 0 0 1 8 13zm8-5a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1 0-1h2a.5.5 0 0 1 .5.5zM3 8a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1 0-1h2A.5.5 0 0 1 3 8zm10.657-5.657a.5.5 0 0 1 0 .707l-1.414 1.415a.5.5 0 1 1-.707-.708l1.414-1.414a.5.5 0 0 1 .707 0zm-9.193 9.193a.5.5 0 0 1 0 .707L3.05 13.657a.5.5 0 0 1-.707-.707l1.414-1.414a.5.5 0 0 1 .707 0zm9.193 2.121a.5.5 0 0 1-.707 0l-1.414-1.414a.5.5 0 0 1 .707-.707l1.414 1.414a.5.5 0 0 1 0 .707zM4.464 4.465a.5.5 0 0 1-.707 0L2.343 3.05a.5.5 0 1 1 .707-.707l1.414 1.414a.5.5 0 0 1 0 .707z"/>
            </svg>
            <svg class="icon theme-toggle__icon theme-toggle__icon--moon" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
              <path fill="currentColor" d="M6 .278a.768.768 0 0 1 .08.858 7.208 7.208 0 0 0-.878 3.46c0 4.021 3.278 7.277 7.318 7.277.527 0 1.04-.055 1.533-.16a.787.787 0 0 1 .81.316.733.733 0 0 1-.031.893A8.349 8.349 0 0 1 8.344 16C3.734 16 0 12.286 0 7.71 0 4.266 2.114 1.312 5.124.06A.752.752 0 0 1 6 .278z"/>
            </svg>
          </button>
        </li>
      </ul>
    </nav>
  </div>
</header>
